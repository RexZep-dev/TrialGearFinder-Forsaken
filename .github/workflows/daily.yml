# Выпуск модуля Forsaken Dungeons+ на CurseForge - сам, без кнопок.
# Запускается каждую ночь и при каждой заливке в master. Скрипт берёт свежий
# рейтинг с сайта, и версия выходит, только если у игрока что-то поменяется:
# рейтинг или файлы модуля - по сравнению с прошлым выпуском. Не поменялось
# ничего (дата снимка и номер версии не в счёт) - ничего не выходит
# (пользователь 3 октября: «если изменений нет вообще - пусть не заливается»).
# Подробно - RELEASING.md.

name: Daily snapshot

on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 по Москве
  push:
    branches:
      - master
  workflow_dispatch:

# Ночной запуск и заливка подряд идут по очереди, не вместе.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ref: master - последнее состояние на момент старта: запуск, ждавший
      # в очереди, не затрёт чужой свежий выпуск.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Обновить снимок и сравнить с прошлым выпуском
        id: sync
        run: |
          LAST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          # Снимок прошлого выпуска - для списка «кто сколько получил».
          if [ -n "$LAST" ]; then git show "$LAST:db/Database.lua" > "$RUNNER_TEMP/old.lua"; fi
          node tools/sync.js
          # Что получает игрок - эти файлы. Дата снимка и номер версии не в счёт.
          FILES="TrialGearFinder_Forsaken.toc Locales.lua Forsaken.lua db/Database.lua"
          if [ -z "$LAST" ]; then
            echo "Выпусков ещё не было - выпускаем."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -I'generatedAt' -I'^## Version:' "$LAST" -- $FILES; then
            echo "С выпуска $LAST у игрока ничего не поменялось - выпуска нет."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Поменялось с выпуска $LAST:"
            git diff --stat -I'generatedAt' -I'^## Version:' "$LAST" -- $FILES
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Версия по дате, коммит и метка
        if: steps.sync.outputs.changed == 'true'
        run: |
          VERSION="$(date -u +%Y.%m.%d)"
          N=1
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
            N=$((N+1)); VERSION="$(date -u +%Y.%m.%d).$N"
          done
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" TrialGearFinder_Forsaken.toc
          # Описание версии на CurseForge: кто сколько рейтинга получил и где
          # (пользователь 8 октября). Упаковщик берёт его по manual-changelog.
          node tools/changes.js "$RUNNER_TEMP/old.lua" db/Database.lua "${{ steps.sync.outputs.last }}" > CHANGELOG.md
          cat CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/Database.lua TrialGearFinder_Forsaken.toc CHANGELOG.md
          git commit --allow-empty -m "Выпуск ${VERSION}"
          # Метка - просто дата (пользователь 3 октября: «назовём просто датой»),
          # из неё же подпись файла на CurseForge. С описанием (-a):
          # --follow-tags отправляет только такие метки. Заливка от имени
          # задания новый запуск не вызывает - петли нет.
          git tag -a "${VERSION}" -m "Выпуск ${VERSION}"
          git push origin HEAD:master --follow-tags
          echo "Версия ${VERSION}"

      - name: Собрать и выложить
        if: steps.sync.outputs.changed == 'true'
        uses: BigWigsMods/packager@master
        with:
          # Имя архива и подпись на CurseForge - одна версия, то есть дата.
          args: -n "{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
